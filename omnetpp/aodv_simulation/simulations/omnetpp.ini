#
# OMNeT++ / INET AODV Simulation Configuration File
# VANET Collision Warning & Traffic Management - Phase 3
#

[General]
network = aodv_simulation.ned.FiveVehicleAodvNetwork
sim-time-limit = 35.0s
cpu-time-limit = 120s

# ---------------------------------------------------------------------------
# Output & Recording Settings
# ---------------------------------------------------------------------------
cmdenv-express-mode = false
cmdenv-autoflush = true
cmdenv-status-frequency = 1s

output-vector-file = ../results/${configname}-#0.vec
output-scalar-file = ../results/${configname}-#0.sca

# ---------------------------------------------------------------------------
# Physical Layer & Wireless Channel (IEEE 802.11p DSRC / UnitDisk Model)
# ---------------------------------------------------------------------------
*.radioMedium.typename = "UnitDiskRadioMedium"

# Vehicle Wireless Interface Parameters
*.v*.wlan[0].typename = "AckingWirelessInterface"
*.v*.wlan[0].radio.typename = "UnitDiskRadio"
*.v*.wlan[0].radio.transmitter.communicationRange = 300m
*.v*.wlan[0].radio.transmitter.interferenceRange = 400m
*.v*.wlan[0].radio.transmitter.detectionRange = 400m
*.v*.wlan[0].radio.transmitter.bitrate = 6Mbps
*.v*.wlan[0].mac.typename = "AckingMac"

# ---------------------------------------------------------------------------
# Vehicle Node Highway Positioning (Stationary Linear Model)
# Inter-vehicle distance = 250m; Radio range = 300m
# Only adjacent vehicles (250m apart) can directly communicate!
# Direct communication between V1 and V5 (1000m) is impossible!
# ---------------------------------------------------------------------------
*.v*.mobility.typename = "StationaryMobility"
*.v*.mobility.initFromDisplayString = false
*.v*.mobility.initialZ = 0m
*.v*.mobility.initialY = 180m

*.v1.mobility.initialX = 100m
*.v2.mobility.initialX = 350m
*.v3.mobility.initialX = 600m
*.v4.mobility.initialX = 850m
*.v5.mobility.initialX = 1100m

# ---------------------------------------------------------------------------
# INET AODV Routing Protocol Configuration (RFC 3561)
# ---------------------------------------------------------------------------
*.v*.routingTable.typename = "Ipv4RoutingTable"
*.v*.aodv.typename = "Aodv"
*.v*.aodv.activeRouteTimeout = 3.0s
*.v*.aodv.deletePeriod = 15.0s
*.v*.aodv.rreqRetries = 2
*.v*.aodv.rreqRateLimit = 10
*.v*.aodv.rerrRateLimit = 10
*.v*.aodv.helloInterval = 1.0s
*.v*.aodv.allowedHelloLoss = 2
*.v*.aodv.netDiameter = 35
*.v*.aodv.nodeTraversalTime = 0.04s

# ---------------------------------------------------------------------------
# Visualizer Settings
# ---------------------------------------------------------------------------
*.visualizer.dataLinkVisualizer.displayLinks = true
*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.mediumVisualizer.displaySignals = true

# ===========================================================================
# EXPERIMENT CONFIGURATIONS
# ===========================================================================

# ---------------------------------------------------------------------------
# Config 1: Initial Route Discovery (Experiment 1)
# Single warning packet transmitted when no route exists; triggers RREQ/RREP
# ---------------------------------------------------------------------------
[Config InitialRouteDiscovery]
description = "V1 initiates on-demand AODV route discovery to V5 for single warning packet"

*.v1.numApps = 1
*.v1.app[0].typename = "UdpBasicApp"
*.v1.app[0].destAddresses = "10.0.0.5"
*.v1.app[0].destPort = 5000
*.v1.app[0].messageLength = 256B
*.v1.app[0].startTime = 15.0s
*.v1.app[0].sendInterval = 1.0s
*.v1.app[0].stopTime = 16.0s

*.v5.numApps = 1
*.v5.app[0].typename = "UdpSink"
*.v5.app[0].localPort = 5000

# ---------------------------------------------------------------------------
# Config 2: Repeated Packet Transmission & Route Caching (Experiment 2)
# 10 sequential packets transmitted; verifies route cache reuse without RREQ
# ---------------------------------------------------------------------------
[Config RepeatedTransmission]
description = "V1 transmits 10 packets to V5 reusing discovered AODV routing table entry"

*.v1.numApps = 1
*.v1.app[0].typename = "UdpBasicApp"
*.v1.app[0].destAddresses = "10.0.0.5"
*.v1.app[0].destPort = 5000
*.v1.app[0].messageLength = 256B
*.v1.app[0].startTime = 15.0s
*.v1.app[0].sendInterval = 1.0s
*.v1.app[0].stopTime = 25.0s

*.v5.numApps = 1
*.v5.app[0].typename = "UdpSink"
*.v5.app[0].localPort = 5000

# ---------------------------------------------------------------------------
# Config 3: Link Failure & Route Error (RERR) (Experiment 3 & 4)
# Route established initially, intermediate vehicle V3 fails at t = 20s
# ---------------------------------------------------------------------------
[Config LinkFailure]
description = "Simulates intermediate node failure (V3 radio shutdown) and RERR propagation"

*.v1.numApps = 1
*.v1.app[0].typename = "UdpBasicApp"
*.v1.app[0].destAddresses = "10.0.0.5"
*.v1.app[0].destPort = 5000
*.v1.app[0].messageLength = 256B
*.v1.app[0].startTime = 15.0s
*.v1.app[0].sendInterval = 1.0s
*.v1.app[0].stopTime = 30.0s

*.v5.numApps = 1
*.v5.app[0].typename = "UdpSink"
*.v5.app[0].localPort = 5000

# ---------------------------------------------------------------------------
# Config 4: Multi-Hop Collision Warning Application (Experiment 5)
# Uses specialized WarningApp module with vehicle telemetry payload
# ---------------------------------------------------------------------------
[Config MultiHopWarningDelivery]
description = "V1 dispatches SUDDEN_BRAKING_WARNING via multi-hop AODV to V5"

*.v1.numApps = 1
*.v1.app[0].typename = "WarningApp"
*.v1.app[0].nodeName = "V1"
*.v1.app[0].nodeId = 1
*.v1.app[0].isSender = true
*.v1.app[0].destAddress = "10.0.0.5"
*.v1.app[0].destPort = 5000
*.v1.app[0].startTime = 15.0s
*.v1.app[0].packetCount = 5
*.v1.app[0].sendInterval = 1.0s
*.v1.app[0].warningType = "SUDDEN_BRAKING_WARNING"
*.v1.app[0].messageId = "WARN_001"

*.v5.numApps = 1
*.v5.app[0].typename = "WarningApp"
*.v5.app[0].nodeName = "V5"
*.v5.app[0].nodeId = 5
*.v5.app[0].isSender = false
*.v5.app[0].localPort = 5000

# ---------------------------------------------------------------------------
# Config 5: Baseline Single-Hop Comparison (Stage G)
# Direct transmission without multi-hop routing; demonstrates 0% PDR
# ---------------------------------------------------------------------------
[Config BaselineSingleHop]
description = "Baseline: V1 attempts direct single-hop transmission to V5 (fails due to distance)"

*.v*.routingTable.typename = "Ipv4RoutingTable"
# Disable multi-hop forwarding; no AODV routing
*.v*.aodv.typename = ""

*.v1.numApps = 1
*.v1.app[0].typename = "UdpBasicApp"
*.v1.app[0].destAddresses = "10.0.0.5"
*.v1.app[0].destPort = 5000
*.v1.app[0].messageLength = 256B
*.v1.app[0].startTime = 15.0s
*.v1.app[0].sendInterval = 1.0s
*.v1.app[0].stopTime = 25.0s

*.v5.numApps = 1
*.v5.app[0].typename = "UdpSink"
*.v5.app[0].localPort = 5000
