#
# OMNeT++ Simulation Configuration File
# VANET Collision Warning & Traffic Management - Phase 2
# Five-Vehicle Multi-hop Communication Network
#

[General]
network = five_vehicle_network.ned.FiveVehicleNetwork
sim-time-limit = 25.0s
cpu-time-limit = 60s

# ---------------------------------------------------------------------------
# Output & Recording Settings
# ---------------------------------------------------------------------------
cmdenv-express-mode = false
cmdenv-autoflush = true
cmdenv-status-frequency = 1s

output-vector-file = ../results/General-#0.vec
output-scalar-file = ../results/General-#0.sca

# ---------------------------------------------------------------------------
# Vehicle Node Parameters
# ---------------------------------------------------------------------------
# V1: Alert Initiator (Simulates sudden braking at t = 15.0s)
*.v1.nodeId = 1
*.v1.nodeName = "V1"
*.v1.isInitiator = true
*.v1.targetNodeId = 5
*.v1.sendTime = 15.0s

# V2: First Intermediate Forwarder
*.v2.nodeId = 2
*.v2.nodeName = "V2"
*.v2.isInitiator = false

# V3: Second Intermediate Forwarder
*.v3.nodeId = 3
*.v3.nodeName = "V3"
*.v3.isInitiator = false

# V4: Third Intermediate Forwarder
*.v4.nodeId = 4
*.v4.nodeName = "V4"
*.v4.isInitiator = false

# V5: Target Destination Vehicle
*.v5.nodeId = 5
*.v5.nodeName = "V5"
*.v5.isInitiator = false
