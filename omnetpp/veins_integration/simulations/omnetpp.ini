#
# OMNeT++ / INET / Veins Co-Simulation Configuration
# Phase 4 - SUMO-OMNeT++ Veins Integration with AODV Routing
#

[General]
network = veins_integration.ned.VeinsHighwayNetwork
sim-time-limit = 45.0s
cpu-time-limit = 180s

# Output settings
cmdenv-express-mode = false
cmdenv-autoflush = true
cmdenv-status-frequency = 1s

output-vector-file = ../results/${configname}-#0.vec
output-scalar-file = ../results/${configname}-#0.sca

# ---------------------------------------------------------------------------
# Veins TraCIScenarioManager Configuration
# Synchronizes vehicle positions dynamically from SUMO via TraCI
# ---------------------------------------------------------------------------
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("veins_launchd.xml")
*.manager.moduleType = "veins_integration.ned.VeinsAodvVehicle"
*.manager.moduleName = "vehicle_"

# ---------------------------------------------------------------------------
# Dynamic Vehicle Node Mobility (Driven by TraCI)
# ---------------------------------------------------------------------------
*.vehicle_*.mobility.typename = "TraCIMobility"
*.vehicle_*.mobility.initFromDisplayString = false

# ---------------------------------------------------------------------------
# Wireless Radio & Physical Layer (IEEE 802.11p DSRC)
# Communication range: 300m
# ---------------------------------------------------------------------------
*.radioMedium.typename = "UnitDiskRadioMedium"

*.vehicle_*.wlan[0].typename = "AckingWirelessInterface"
*.vehicle_*.wlan[0].radio.typename = "UnitDiskRadio"
*.vehicle_*.wlan[0].radio.transmitter.communicationRange = 300m
*.vehicle_*.wlan[0].radio.transmitter.interferenceRange = 400m
*.vehicle_*.wlan[0].radio.transmitter.detectionRange = 400m
*.vehicle_*.wlan[0].radio.transmitter.bitrate = 6Mbps
*.vehicle_*.wlan[0].mac.typename = "AckingMac"

# ---------------------------------------------------------------------------
# INET AODV Routing Protocol Configuration (RFC 3561)
# ---------------------------------------------------------------------------
*.vehicle_*.routingTable.typename = "Ipv4RoutingTable"
*.vehicle_*.aodv.typename = "Aodv"
*.vehicle_*.aodv.activeRouteTimeout = 3.0s
*.vehicle_*.aodv.deletePeriod = 15.0s
*.vehicle_*.aodv.rreqRetries = 2
*.vehicle_*.aodv.rreqRateLimit = 10
*.vehicle_*.aodv.rerrRateLimit = 10
*.vehicle_*.aodv.helloInterval = 1.0s
*.vehicle_*.aodv.allowedHelloLoss = 2
*.vehicle_*.aodv.netDiameter = 35
*.vehicle_*.aodv.nodeTraversalTime = 0.04s

# ---------------------------------------------------------------------------
# Visualizer Settings
# ---------------------------------------------------------------------------
*.visualizer.dataLinkVisualizer.displayLinks = true
*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.mediumVisualizer.displaySignals = true

# ===========================================================================
# EXPERIMENT CONFIGURATIONS
# ===========================================================================

# ---------------------------------------------------------------------------
# Config 1: Normal Vehicle Movement & Mobility Synchronization (Exp 1)
# ---------------------------------------------------------------------------
[Config NormalMobilitySync]
description = "Verifies dynamic TraCI node creation and position synchronization for 5 vehicles"

# ---------------------------------------------------------------------------
# Config 2: Wireless Communication between Moving Vehicles (Exp 2)
# ---------------------------------------------------------------------------
[Config WirelessMobilityCommunication]
description = "Point-to-point wireless transmission between moving vehicles V1 and V2"

*.vehicle_V1.numApps = 1
*.vehicle_V1.app[0].typename = "VeinsWarningApp"
*.vehicle_V1.app[0].isSender = true
*.vehicle_V1.app[0].destAddress = "10.0.0.2"
*.vehicle_V1.app[0].destPort = 5000
*.vehicle_V1.app[0].startTime = 5.0s
*.vehicle_V1.app[0].packetCount = 10
*.vehicle_V1.app[0].sendInterval = 1.0s

*.vehicle_V2.numApps = 1
*.vehicle_V2.app[0].typename = "VeinsWarningApp"
*.vehicle_V2.app[0].isSender = false
*.vehicle_V2.app[0].localPort = 5000

# ---------------------------------------------------------------------------
# Config 3: Multi-Hop Communication Under Dynamic Mobility (Exp 3)
# ---------------------------------------------------------------------------
[Config DynamicMultiHopAodv]
description = "V1 sends multi-hop packets to V5 across moving intermediate vehicles V2->V3->V4"

*.vehicle_V1.numApps = 1
*.vehicle_V1.app[0].typename = "VeinsWarningApp"
*.vehicle_V1.app[0].isSender = true
*.vehicle_V1.app[0].destAddress = "10.0.0.5"
*.vehicle_V1.app[0].destPort = 5000
*.vehicle_V1.app[0].startTime = 15.0s
*.vehicle_V1.app[0].packetCount = 10
*.vehicle_V1.app[0].sendInterval = 1.0s

*.vehicle_V5.numApps = 1
*.vehicle_V5.app[0].typename = "VeinsWarningApp"
*.vehicle_V5.app[0].isSender = false
*.vehicle_V5.app[0].localPort = 5000

# ---------------------------------------------------------------------------
# Config 4: Mobility-Induced Link Failure & Recovery (Exp 4 & 5)
# ---------------------------------------------------------------------------
[Config MobilityLinkFailureRecovery]
description = "Vehicles accelerate and spread out beyond 300m range, breaking link and triggering AODV RERR"

*.vehicle_V1.numApps = 1
*.vehicle_V1.app[0].typename = "VeinsWarningApp"
*.vehicle_V1.app[0].isSender = true
*.vehicle_V1.app[0].destAddress = "10.0.0.5"
*.vehicle_V1.app[0].destPort = 5000
*.vehicle_V1.app[0].startTime = 15.0s
*.vehicle_V1.app[0].packetCount = 15
*.vehicle_V1.app[0].sendInterval = 1.0s

*.vehicle_V5.numApps = 1
*.vehicle_V5.app[0].typename = "VeinsWarningApp"
*.vehicle_V5.app[0].isSender = false
*.vehicle_V5.app[0].localPort = 5000
